        <style>

            .column {
                padding: 5px;
            }

            .tab {
                align-items: center;
                justify-content: center;
                display: flex;
                flex-wrap: wrap;
            }

            .tab[hidden] {
                display: none;
            }

            .imglink {
                width: 50px;
                filter: none;
            }

            .imglink:hover {
                width: 50px;
                filter: invert(68%) sepia(33%) saturate(1274%) hue-rotate(168deg) brightness(108%) contrast(102%);
            }

            @font-face {
                font-family: "myFont" ;
                src: url("Poppins-ExtraLight.ttf" );
            }

            .name {
                font-family: "myFont";
                font-size: 32px;
            }

            .profile-title {
                font-size: clamp(26px, 9vw, 32px);
            }

            .works-title {
                text-align: center;
                font-size: 20px;
                margin: 0.67em 0;
            }

            .worklist-spacer, .worklist-mascot {
                width: 30px;
            }

            .proj, .extend-button {
                border: 0;
                background: none;
                color: inherit;
                font: inherit;
                cursor: pointer;
            }

            .proj {
                padding: 0;
                border-radius: 50%;
            }

            .proj:focus-visible, .extend-button:focus-visible {
                outline: 2px solid #1967a3;
                outline-offset: 3px;
            }

            .projico {
                display: block;
                border-radius: 50%;
                filter: grayscale(1);
                width: 48px;
            }

            .proj:focus-visible .projico, .proj[aria-pressed="true"] .projico {
                filter: none;
            }

            @media (hover: hover) {
                .proj:hover .projico {
                    filter: none;
                }
            }

            .proj[aria-pressed="true"] .projico {
                width: 64px;
            }

            .extend-row {
                text-align: center;
            }

            .extend-button {
                min-height: 44px;
                padding: 0 8px;
                text-decoration: underline;
            }

            .project-title, .project-copy {
                text-align: center;
                font-size: 20px;
                overflow-wrap: anywhere;
            }

            .project-title {
                margin: 5px 0 1.33em;
            }

            .project-title a {
                color: #000;
            }

            .project-copy {
                max-width: 500px;
                margin: -25px auto 0;
                font-weight: 600;
            }

            .project-screens {
                flex-wrap: nowrap;
            }

            .screens {
                box-sizing: border-box;
                padding: 5px;
                width: 510px;
                min-width: 0;
                max-width: 100%;
                border-radius: 10px;
            }

            @media (min-width: 1320px) {
                .extend-row {
                    position: fixed;
                    right: 1%;
                    bottom: 1%;
                }
            }

            @media (max-width: 740px) {
                .project-list .column {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    width: 59px;
                    min-height: 62px;
                    padding: 0;
                }

                .proj[aria-pressed="true"] .projico {
                    width: 56px;
                }

                .worklist-spacer {
                    display: none;
                }
            }

            @media (max-width: 640px) {
                .project-screens {
                    flex-wrap: wrap;
                }
            }

            @media (max-width: 415px) {
                .contact-list {
                    max-width: 250px;
                    margin-inline: auto;
                }
            }

            @media (max-width: 369px) {
                .project-list .column {
                    width: 72px;
                }
            }

        </style>
